name: ci

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress or queued.
# macOS runners are scarce (few concurrent jobs per account): don't let
# outdated runs wait for them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...
      - run: go test -race ./...
      - name: Cross-compile agents
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/typehaus-agent
          done

  # Everything macOS in ONE job: macOS runners are the bottleneck (a job
  # takes about a minute, but waiting for a free runner can take ten).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/agent/... ./cmd/typehaus-agent
      - name: Every system font must import
        run: go run ./tools/fontscan -strict -gha /System/Library/Fonts /Library/Fonts
      - name: Build
        run: |
          go build -o bin/typehaus-server ./cmd/typehaus-server
          go build -o bin/typehaus-agent ./cmd/typehaus-agent
          go build -o bin/e2e ./tools/e2e
      - name: End-to-end test (install, removal, revocation)
        # TypehausTestBitmap.fon must NOT be installed on macOS
        run: bin/e2e -server bin/typehaus-server -agent bin/typehaus-agent -font "testdata/fonts/Poppins-Regular.woff2,testdata/fonts/TypehausTestBitmap.fon"
      - name: Menu-bar app
        run: packaging/macos/build-app.sh ci
      - name: Smoke test
        run: |
          dist/agents/typehaus-agent-darwin-arm64 version
          unzip -q dist/agents/typehaus-agent-darwin-universal.app.zip -d /tmp/app
          lipo -info /tmp/app/typehaus.app/Contents/MacOS/typehaus-agent
          codesign --verify --verbose /tmp/app/typehaus.app
      - name: Installer disk image
        run: |
          set -e
          hdiutil attach dist/agents/typehaus-macos.dmg -nobrowse -readonly -mountpoint /tmp/thdmg
          test -d /tmp/thdmg/typehaus.app
          test "$(readlink /tmp/thdmg/Applications)" = /Applications
          codesign --verify --deep --strict --verbose=2 /tmp/thdmg/typehaus.app
          mkdir -p ~/Applications
          ditto /tmp/thdmg/typehaus.app ~/Applications/typehaus.app
          hdiutil detach /tmp/thdmg
          ~/Applications/typehaus.app/Contents/MacOS/typehaus-agent version

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest] # macOS: see the macos job
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install fontconfig and fonts in other formats
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig xfonts-base fonts-urw-base35
      - name: Build
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          go build -o "bin/typehaus-server$ext" ./cmd/typehaus-server
          go build -o "bin/typehaus-agent$ext" ./cmd/typehaus-agent
          go build -o "bin/e2e$ext" ./tools/e2e
      - name: Windows installer (install, update, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path "$nsis\makensis.exe")) {
            choco install nsis -y --no-progress | Out-Null
          }
          $env:PATH += ";$nsis"
          New-Item -ItemType Directory -Force out/win, dist | Out-Null
          $env:CGO_ENABLED = '0'; $env:GOOS = 'windows'
          foreach ($arch in 'amd64', 'arm64') {
            $env:GOARCH = $arch
            # no version stamp: "dev" counts as current on the server
            go build -o "out/win/typehaus-agent-windows-$arch.exe" ./cmd/typehaus-agent
            go build -ldflags "-H=windowsgui" -o "out/win/typehaus-agentw-windows-$arch.exe" ./cmd/typehaus-agent
          }
          Remove-Item Env:GOARCH
          # quoted: PowerShell splits an unquoted -DVERSION=0.0.0-ci at the dots
          makensis -V2 "-DVERSION=0.0.0-ci" "-DSRC=$PWD\out\win" "-DOUTFILE=$PWD\dist\typehaus-setup-windows.exe" packaging\windows\typehaus.nsi
          if ($LASTEXITCODE) { exit 1 }
          pwsh packaging/windows/test-installer.ps1 dist\typehaus-setup-windows.exe
      - name: Pick test fonts (every format this OS handles)
        id: fonts
        shell: bash
        run: |
          fonts="testdata/fonts/Poppins-Regular.woff2"
          case "$RUNNER_OS" in
            Linux)
              pcf=$(find /usr/share/fonts -name '*.pcf.gz' | sort | head -1)
              t1=$(find /usr/share/fonts -name '*.t1' | sort | head -1)
              afm="${t1%.t1}.afm"
              fonts="$fonts,$pcf"
              [ -n "$t1" ] && fonts="$fonts,$t1"
              [ -f "$afm" ] && fonts="$fonts,$afm"
              ;;
            Windows) fonts="$fonts,C:/Windows/Fonts/8514oem.fon" ;;
          esac
          echo "list=$fonts" >> "$GITHUB_OUTPUT"
          echo "$fonts"
      - name: End-to-end test (install, removal, revocation)
        if: runner.os != 'Windows'
        run: bin/e2e -server bin/typehaus-server -agent bin/typehaus-agent -font "${{ steps.fonts.outputs.list }}"
      - name: Linux packages (install, end-to-end test with the installed program, remove)
        if: runner.os == 'Linux'
        run: |
          set -e
          mkdir -p out/linux
          for arch in amd64 arm64; do
            # no version stamp: "dev" counts as current on the server (an
            # "old" version would correctly not be sent Type 1 fonts)
            CGO_ENABLED=0 GOARCH=$arch go build -o out/linux/typehaus-agent-linux-$arch ./cmd/typehaus-agent
          done
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          NFPM="$(go env GOPATH)/bin/nfpm" packaging/linux/build.sh v0.0.0-ci out/linux dist
          sudo apt-get install -y --no-install-recommends desktop-file-utils >/dev/null
          sudo dpkg -i dist/typehaus-linux-amd64.deb
          typehaus version
          typehaus-agent version
          desktop-file-validate /usr/share/applications/typehaus.desktop
          test -f /usr/share/icons/hicolor/256x256/apps/typehaus.png
          bin/e2e -server bin/typehaus-server -agent /usr/bin/typehaus -font "${{ steps.fonts.outputs.list }}"
          sudo dpkg -r typehaus
          ! test -e /usr/bin/typehaus
          ! test -e /usr/share/applications/typehaus.desktop
          echo "Linux package: OK"
      - name: End-to-end test incl. all-users service (Windows, admin)
        if: runner.os == 'Windows'
        run: bin\e2e.exe -server bin\typehaus-server.exe -agent bin\typehaus-agent.exe -font "${{ steps.fonts.outputs.list }}" -machine

  font-corpus:
    name: font corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dirs: C:/Windows/Fonts
          - os: ubuntu-latest
            dirs: /usr/share/fonts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install more font formats (Type 1, X11 bitmap, OpenType)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xfonts-base xfonts-75dpi fonts-urw-base35 gsfonts fonts-noto-color-emoji || true
      - name: Every system font must import
        shell: bash
        run: go run ./tools/fontscan -strict -gha ${{ matrix.dirs }}
