name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...
      - run: go test -race ./...
      - name: Cross-compile agents
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/typehaus-agent
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/agent/... ./cmd/typehaus-agent
      - run: packaging/macos/build-app.sh ci
      - name: Smoke test
        run: |
          dist/agents/typehaus-agent-darwin-arm64 version
          unzip -q dist/agents/typehaus-agent-darwin-universal.app.zip -d /tmp/app
          lipo -info /tmp/app/typehaus.app/Contents/MacOS/typehaus-agent
          codesign --verify --verbose /tmp/app/typehaus.app

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install fontconfig
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig
      - name: Build
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          go build -o "bin/typehaus-server$ext" ./cmd/typehaus-server
          go build -o "bin/typehaus-agent$ext" ./cmd/typehaus-agent
          go build -o "bin/e2e$ext" ./tools/e2e
      - name: End-to-end test (per-user install, removal, revocation)
        if: runner.os != 'Windows'
        run: bin/e2e -server bin/typehaus-server -agent bin/typehaus-agent -font testdata/fonts/Poppins-Regular.ttf
      - name: End-to-end test incl. all-users service (Windows, admin)
        if: runner.os == 'Windows'
        run: bin\e2e.exe -server bin\typehaus-server.exe -agent bin\typehaus-agent.exe -font testdata\fonts\Poppins-Regular.ttf -machine

  font-corpus:
    name: font corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dirs: C:/Windows/Fonts
          - os: macos-latest
            dirs: /System/Library/Fonts /Library/Fonts
          - os: ubuntu-latest
            dirs: /usr/share/fonts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Parse every system font
        shell: bash
        run: go run ./tools/fontscan -gha ${{ matrix.dirs }}
