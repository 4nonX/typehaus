name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install test fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core fontconfig
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: GOOS=darwin CGO_ENABLED=0 go vet ./...
      - run: go test -race ./...
      - name: Cross-compile agents
        run: |
          for t in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/typehaus-agent
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./internal/agent/... ./cmd/typehaus-agent
      - run: packaging/macos/build-app.sh ci
      - name: Smoke test
        run: |
          dist/agents/typehaus-agent-darwin-arm64 version
          unzip -q dist/agents/typehaus-agent-darwin-universal.app.zip -d /tmp/app
          lipo -info /tmp/app/typehaus.app/Contents/MacOS/typehaus-agent
          codesign --verify --verbose /tmp/app/typehaus.app

  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install fontconfig and fonts in other formats
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig xfonts-base fonts-urw-base35
      - name: Build
        shell: bash
        run: |
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          go build -o "bin/typehaus-server$ext" ./cmd/typehaus-server
          go build -o "bin/typehaus-agent$ext" ./cmd/typehaus-agent
          go build -o "bin/e2e$ext" ./tools/e2e
      - name: Pick test fonts (every format this OS handles)
        id: fonts
        shell: bash
        run: |
          fonts="testdata/fonts/Poppins-Regular.woff2"
          case "$RUNNER_OS" in
            Linux)
              pcf=$(ls /usr/share/fonts/X11/misc/*.pcf.gz | head -1)
              t1=$(ls /usr/share/fonts/X11/Type1/*.t1 /usr/share/fonts/type1/urw-base35/*.t1 2>/dev/null | head -1)
              afm="${t1%.t1}.afm"
              fonts="$fonts,$pcf"
              [ -n "$t1" ] && fonts="$fonts,$t1"
              [ -f "$afm" ] && fonts="$fonts,$afm"
              ;;
            Windows) fonts="$fonts,C:/Windows/Fonts/8514oem.fon" ;;
            macOS)   fonts="$fonts,testdata/fonts/TypehausTestBitmap.fon" ;;  # must NOT be installed on macOS
          esac
          echo "list=$fonts" >> "$GITHUB_OUTPUT"
          echo "$fonts"
      - name: End-to-end test (install, removal, revocation)
        if: runner.os != 'Windows'
        run: bin/e2e -server bin/typehaus-server -agent bin/typehaus-agent -font "${{ steps.fonts.outputs.list }}"
      - name: End-to-end test incl. all-users service (Windows, admin)
        if: runner.os == 'Windows'
        run: bin\e2e.exe -server bin\typehaus-server.exe -agent bin\typehaus-agent.exe -font "${{ steps.fonts.outputs.list }}" -machine

  font-corpus:
    name: font corpus (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dirs: C:/Windows/Fonts
          - os: macos-latest
            dirs: /System/Library/Fonts /Library/Fonts
          - os: ubuntu-latest
            dirs: /usr/share/fonts
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install more font formats (Type 1, X11 bitmap, OpenType)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xfonts-base xfonts-75dpi fonts-urw-base35 gsfonts fonts-noto-color-emoji || true
      - name: Every system font must import
        shell: bash
        run: go run ./tools/fontscan -strict -gha ${{ matrix.dirs }}
