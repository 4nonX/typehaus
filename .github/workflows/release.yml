name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"] # not applied to tags
  workflow_dispatch:

# Pushes to main replace an older edge build still waiting for a runner;
# release tags always run to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # Windows agents: built here, signed by SignPath when configured
  # (see docs/signing.md), then used for both the GitHub release and the image.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/typehaus-agent/winres/winres.json \
            --out cmd/typehaus-agent/rsrc --arch amd64,arm64 --product-version git-tag --file-version git-tag || true
          mkdir -p out/windows
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o out/windows/typehaus-agent-windows-$arch.exe ./cmd/typehaus-agent
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$V" \
              -o out/windows/typehaus-agentw-windows-$arch.exe ./cmd/typehaus-agent
          done
      - name: Upload unsigned
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: out/windows/
          retention-days: 3
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/windows-signed
      - name: Use signed binaries
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: cp -v out/windows-signed/*.exe out/windows/
      # Installer (NSIS), built from the signed programs – one setup for
      # Intel/AMD and ARM (packaging/windows/typehaus.nsi)
      - name: Build installer
        run: |
          set -e
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends nsis
          V=$(git describe --tags --always); V=${V#v}
          mkdir -p out/setup
          makensis -V2 -DVERSION="$V" -DSRC="$PWD/out/windows" -DOUTFILE="$PWD/out/setup/typehaus-setup-windows.exe" packaging/windows/typehaus.nsi
      - name: Upload unsigned installer
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-unsigned
          path: out/setup/
          retention-days: 3
      - name: Sign installer with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/setup-signed
      - name: Use signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: cp -v out/setup-signed/*.exe out/setup/
      - run: cp -v out/setup/typehaus-setup-windows.exe out/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-agents
          path: out/windows/
          retention-days: 7

  # Linux programs and packages (deb, rpm: packaging/linux)
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          [ "${GITHUB_REF_TYPE}" = tag ] || V=$(git describe --tags --always)
          mkdir -p out/linux
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o out/linux/typehaus-agent-linux-$arch ./cmd/typehaus-agent
          done
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0
          NFPM="$(go env GOPATH)/bin/nfpm" packaging/linux/build.sh "$V" out/linux out/linux
          ls -la out/linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agents
          path: out/linux/
          retention-days: 7

  # macOS menu-bar app: needs cgo, so it is built on macOS. Signed with a
  # Developer ID and notarized when the secrets exist (docs/signing.md).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build, sign, notarize
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/build-app.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-agents
          path: dist/agents/
          retention-days: 7

  # The release does not wait for macOS: macOS runners can be queued for a
  # long time. Everything else is published as soon as it is ready, and the
  # macOS job of the SAME run adds the Mac app afterwards (macos-finish) –
  # nothing to trigger by hand. If macOS fails, this run fails: re-run the
  # failed jobs to complete the release.

  # 1) image without the Mac app (the cross-compiled macOS command-line
  #    agent is included); replaced by the full image in macos-finish
  image:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-agents
          path: dist/agents/
      - uses: actions/download-artifact@v4
        with:
          name: linux-agents
          path: dist/agents/
      - uses: ./.github/actions/image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 2) GitHub release with Windows, Linux and the servers
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: windows-agents
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: linux-agents
          path: dist/
      - name: Build servers
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o dist/typehaus-server-linux-$arch ./cmd/typehaus-server
          done
          cd dist && sha256sum typehaus-* > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          .github/release-notes.sh "${GITHUB_REF_NAME#v}" > notes.md
          printf '\n---\n_The macOS app is still being built and will be attached to this release automatically._\n' >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md

  # 3) as soon as the Mac app is ready: attach it to the release and publish
  #    the image with it under the same tags
  macos-finish:
    needs: [macos, image, binaries]
    # binaries is skipped for pushes to main; run anyway once macOS succeeded
    if: ${{ !cancelled() && needs.macos.result == 'success' && needs.image.result == 'success' && (needs.binaries.result == 'success' || needs.binaries.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-agents
          path: mac/
      - name: Attach the macOS app to the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          T=${GITHUB_REF_NAME}
          gh release download "$T" -p SHA256SUMS -D sums
          (cd mac && sha256sum typehaus-*) >> sums/SHA256SUMS
          gh release upload "$T" mac/typehaus-* sums/SHA256SUMS --clobber
          .github/release-notes.sh "${T#v}" > notes.md
          gh release edit "$T" --notes-file notes.md
      - uses: actions/download-artifact@v4
        with:
          name: windows-agents
          path: dist/agents/
      - uses: actions/download-artifact@v4
        with:
          name: linux-agents
          path: dist/agents/
      - run: cp -v mac/typehaus-* dist/agents/
      - uses: ./.github/actions/image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
