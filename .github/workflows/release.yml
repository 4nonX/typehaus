name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"] # not applied to tags
  workflow_dispatch:

# Pushes to main replace an older edge build still waiting for a runner;
# release tags always run to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  # Windows agents: built here, signed by SignPath when configured
  # (see docs/signing.md), then used for both the GitHub release and the image.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/typehaus-agent/winres/winres.json \
            --out cmd/typehaus-agent/rsrc --arch amd64,arm64 --product-version git-tag --file-version git-tag || true
          mkdir -p out/windows
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o out/windows/typehaus-agent-windows-$arch.exe ./cmd/typehaus-agent
            CGO_ENABLED=0 GOOS=windows GOARCH=$arch go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=$V" \
              -o out/windows/typehaus-agentw-windows-$arch.exe ./cmd/typehaus-agent
          done
      - name: Upload unsigned
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: out/windows/
          retention-days: 3
      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: out/windows-signed
      - name: Use signed binaries
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: cp -v out/windows-signed/*.exe out/windows/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-agents
          path: out/windows/
          retention-days: 7

  # macOS menu-bar app: needs cgo, so it is built on macOS. Signed with a
  # Developer ID and notarized when the secrets exist (docs/signing.md).
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build, sign, notarize
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: packaging/macos/build-app.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-agents
          path: dist/agents/
          retention-days: 7

  image:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-agents
          path: dist/agents/
      - uses: actions/download-artifact@v4
        with:
          name: windows-agents
          path: dist/agents/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: macos-agents
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: windows-agents
          path: dist/
      - name: Build Linux agents and servers
        run: |
          set -e
          V=${GITHUB_REF_NAME}
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o dist/typehaus-agent-linux-$arch ./cmd/typehaus-agent
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$V" \
              -o dist/typehaus-server-linux-$arch ./cmd/typehaus-server
          done
          cd dist && sha256sum typehaus-* > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="$V" '/^## \[/{p = (index($0, "[" v "]") > 0); next} p && !/^\[[^]]+\]: /' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
