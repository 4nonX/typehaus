name: Build and push the server image
description: Multi-arch image with the agents in dist/agents baked in (see Dockerfile).
inputs:
  token:
    description: GITHUB_TOKEN for ghcr.io
    required: true
runs:
  using: composite
  steps:
    # every image build replaces the tag, so each one must carry everything
    # the Devices page offers – not just what its own job built
    - name: Check the files to bake in
      shell: bash
      run: |
        set -e
        ls -l dist/agents/
        for f in typehaus-illustrator.zxp; do
          test -s "dist/agents/$f" || { echo "::error::dist/agents/$f is missing – the image would offer no download for it"; exit 1; }
        done
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=edge,branch=main
    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: VERSION=${{ steps.meta.outputs.version }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
