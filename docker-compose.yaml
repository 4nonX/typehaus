# typehaus – self-hosted font server
#
# Works as-is in Dockge (paste this as the stack's compose file and the
# contents of .env.example into the .env editor) or with plain
# `docker compose up -d` next to a .env file.
#
# All settings live in .env – see .env.example. Install guide: docs/install.md

services:
  typehaus:
    image: ghcr.io/4nonx/typehaus:${TYPEHAUS_VERSION:-latest}
    container_name: typehaus
    restart: unless-stopped
    ports:
      # Behind a reverse proxy on the same host, bind to localhost only:
      #   TYPEHAUS_BIND=127.0.0.1
      - "${TYPEHAUS_BIND:-0.0.0.0}:${TYPEHAUS_PORT:-8080}:8080"
    volumes:
      # Database and font files. A named volume avoids permission issues
      # (the container runs as uid 65532). For a folder next to the compose
      # file instead, see docs/install.md → "Storing data in a folder".
      - typehaus-data:/data
    environment:
      TYPEHAUS_BASE_URL: ${TYPEHAUS_BASE_URL:?Set TYPEHAUS_BASE_URL in .env (the address users and agents open)}
      TYPEHAUS_ADMIN_USER: ${TYPEHAUS_ADMIN_USER:-admin}
      TYPEHAUS_ADMIN_PASSWORD: ${TYPEHAUS_ADMIN_PASSWORD:-}
      TYPEHAUS_TRUST_PROXY: ${TYPEHAUS_TRUST_PROXY:-true}
      TYPEHAUS_POLL_SECONDS: ${TYPEHAUS_POLL_SECONDS:-60}
      TYPEHAUS_MAX_UPLOAD_MB: ${TYPEHAUS_MAX_UPLOAD_MB:-512}
      TYPEHAUS_DOWNLOADS: ${TYPEHAUS_DOWNLOADS:-true}
      TYPEHAUS_SESSION_HOURS: ${TYPEHAUS_SESSION_HOURS:-168}
      TYPEHAUS_LOCAL_LOGIN: ${TYPEHAUS_LOCAL_LOGIN:-true}
      # Single sign-on (optional) – leave TYPEHAUS_OIDC_ISSUER empty to disable
      TYPEHAUS_OIDC_ISSUER: ${TYPEHAUS_OIDC_ISSUER:-}
      TYPEHAUS_OIDC_CLIENT_ID: ${TYPEHAUS_OIDC_CLIENT_ID:-}
      TYPEHAUS_OIDC_CLIENT_SECRET: ${TYPEHAUS_OIDC_CLIENT_SECRET:-}
      TYPEHAUS_OIDC_NAME: ${TYPEHAUS_OIDC_NAME:-}
      TYPEHAUS_OIDC_GROUPS_CLAIM: ${TYPEHAUS_OIDC_GROUPS_CLAIM:-}
      TYPEHAUS_OIDC_ADMIN_GROUP: ${TYPEHAUS_OIDC_ADMIN_GROUP:-}
      TYPEHAUS_OIDC_AUTO_CREATE: ${TYPEHAUS_OIDC_AUTO_CREATE:-true}

volumes:
  typehaus-data:
