services:
  typehaus:
    image: ghcr.io/4nonx/typehaus:latest
    # build: .            # uncomment to build from source
    container_name: typehaus
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - typehaus-data:/data
    environment:
      # Public URL as users and agents reach it (required for SSO, recommended always)
      TYPEHAUS_BASE_URL: "https://fonts.example.com"
      # Initial admin – only used on first start. If unset, a random password is logged.
      TYPEHAUS_ADMIN_USER: "admin"
      # TYPEHAUS_ADMIN_PASSWORD: "change-me-please"
      # Set to true when running behind a reverse proxy that sets X-Forwarded-For/-Proto
      TYPEHAUS_TRUST_PROXY: "true"
      # Optional single sign-on (Authentik, Keycloak, Authelia, Zitadel, Entra ID, …)
      # TYPEHAUS_OIDC_ISSUER: "https://auth.example.com/application/o/typehaus/"
      # TYPEHAUS_OIDC_CLIENT_ID: "typehaus"
      # TYPEHAUS_OIDC_CLIENT_SECRET: "…"
      # TYPEHAUS_OIDC_NAME: "Authentik"
      # TYPEHAUS_OIDC_GROUPS_CLAIM: "groups"
      # TYPEHAUS_OIDC_ADMIN_GROUP: "typehaus-admins"

volumes:
  typehaus-data:
